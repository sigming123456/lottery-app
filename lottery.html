<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>幸运抽奖 · 农行昆明分行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--abc-blue:#0047AB;
--abc-blue-deep:#003380;
--abc-blue-dark:#002766;
--cyan:#00D4FF;
--teal:#00D4AA;
--green:#00E676;
--green-deep:#00C853;
--accent:#00BCD4;
--card:rgba(255,255,255,.08);
--card-border:rgba(0,212,255,.2);
--text:#fff;
--text2:rgba(255,255,255,.55);
--red:#ff5252;
}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
background:linear-gradient(160deg,#002766 0%,#003380 30%,#0047AB 60%,#0066CC 100%);
min-height:100vh;display:flex;align-items:center;justify-content:center;
overflow-y:auto;color:var(--text);user-select:none;
}

/* 波浪背景装饰 */
.bg-deco{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco .wave{position:absolute;width:200%;height:200%;border-radius:45%;opacity:.04}
.bg-deco .w1{background:var(--cyan);top:-60%;left:-50%;animation:waveSpin 20s linear infinite}
.bg-deco .w2{background:var(--green);bottom:-60%;right:-50%;animation:waveSpin 25s linear infinite reverse}
@keyframes waveSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.bg-deco .circle{position:absolute;border-radius:50%;border:1px solid rgba(0,212,255,.06)}
.bg-deco .c1{width:300px;height:300px;top:10%;left:-100px}
.bg-deco .c2{width:200px;height:200px;bottom:10%;right:-60px}
.bg-deco .c3{width:400px;height:400px;top:30%;right:-150px;opacity:.5}

/* 顶部活动横幅 */
.event-banner{
position:relative;z-index:1;width:100%;max-width:420px;
background:linear-gradient(90deg,var(--teal) 0%,var(--accent) 40%,var(--abc-blue) 100%);
border-radius:0 0 20px 20px;
padding:14px 20px;
display:flex;align-items:center;justify-content:space-between;
box-shadow:0 4px 20px rgba(0,71,171,.3);
margin-bottom:0;
}
.event-banner .bank-info{display:flex;align-items:center;gap:8px}
.event-banner .abc-logo{
width:30px;height:30px;
display:flex;align-items:center;justify-content:center;
}
.event-banner .abc-logo img{width:100%;height:100%;object-fit:contain}
.event-banner .bank-name{font-size:13px;font-weight:700;color:#fff;line-height:1.3;font-family:'STSong','SimSun','Songti SC','Noto Serif SC',serif;letter-spacing:1px}
.event-banner .bank-name .branch{font-size:10px;opacity:.85;font-family:'STSong','SimSun','Songti SC','Noto Serif SC',serif}
.event-banner .km-mark{
font-size:18px;font-weight:800;color:#fff;
letter-spacing:2px;
text-shadow:0 1px 4px rgba(0,0,0,.2);
opacity:.9;
}

.app{position:relative;z-index:1;width:100%;max-width:420px;padding:20px;text-align:center}

/* 标题区 */
.title-section{margin-bottom:24px}
.title{
font-size:26px;font-weight:800;letter-spacing:6px;
color:#fff;
text-shadow:0 2px 10px rgba(0,212,255,.3);
margin-bottom:6px;
}
.slogan{
font-size:15px;font-weight:600;letter-spacing:4px;
background:linear-gradient(90deg,var(--cyan),var(--green),var(--cyan));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
margin-bottom:4px;
}
.subtitle{font-size:11px;color:var(--text2);letter-spacing:2px}

/* 抽奖区 */
.lucky-area{position:relative;width:260px;height:260px;margin:0 auto 24px}
.lucky-ring{position:absolute;inset:-12px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--cyan),transparent,var(--green),transparent,var(--accent),transparent);animation:ringSpin 4s linear infinite;opacity:.5}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.lucky-btn{
position:absolute;inset:0;width:100%;height:100%;border-radius:50%;border:none;
background:radial-gradient(circle at 30% 30%,rgba(0,230,118,.15),rgba(0,212,255,.1) 40%,rgba(0,71,171,.05) 70%,transparent);
background-color:#003380;
border:3px solid rgba(0,212,255,.25);
cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
transition:transform .2s,box-shadow .3s;
box-shadow:0 0 40px rgba(0,212,255,.12),inset 0 0 60px rgba(0,230,118,.05);
}
.lucky-btn:hover{transform:scale(1.03);box-shadow:0 0 60px rgba(0,212,255,.2),inset 0 0 60px rgba(0,230,118,.08)}
.lucky-btn:active{transform:scale(.97)}
.lucky-btn.spinning{animation:btnPulse .5s ease infinite;pointer-events:none}
@keyframes btnPulse{0%,100%{box-shadow:0 0 40px rgba(0,212,255,.12)}50%{box-shadow:0 0 80px rgba(0,212,255,.35)}}
.lucky-btn.disabled{opacity:.5;pointer-events:none}
.lucky-btn .icon{font-size:56px;margin-bottom:4px;line-height:1}
.lucky-btn .label{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--cyan)}
.lucky-btn .hint{font-size:11px;color:var(--text2);margin-top:4px}

.rolling-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--cyan);z-index:5}
.remain{font-size:13px;color:var(--text2);margin-bottom:16px}
.remain .num{color:var(--green);font-weight:700;font-size:18px}

/* 按钮组 */
.btn-group{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn-mini{
padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
border:1px solid rgba(0,212,255,.15);
background:rgba(0,212,255,.06);color:var(--text);
transition:.2s;
}
.btn-mini:active{transform:scale(.96)}
.btn-mini.cyan{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,71,171,.1));border-color:rgba(0,212,255,.25);color:var(--cyan)}
.btn-mini.green{background:linear-gradient(135deg,rgba(0,230,118,.12),rgba(0,200,83,.08));border-color:rgba(0,230,118,.2);color:var(--green)}

/* 最新中奖 */
.latest-prize{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:14px;margin-bottom:16px;backdrop-filter:blur(10px);display:none}
.latest-prize.show{display:block;animation:fadeIn .3s}
.latest-prize .lp-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.latest-prize .lp-name{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 中奖记录 */
.history-section{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px)}
.history-title{font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.history-title .clear-btn{font-size:11px;color:var(--text2);cursor:pointer;border:1px solid rgba(255,255,255,.1);padding:2px 10px;border-radius:20px}
.history-title .clear-btn:active{background:rgba(255,255,255,.08)}
.history-list{max-height:180px;overflow-y:auto;text-align:left}
.history-list::-webkit-scrollbar{width:4px}
.history-list::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:4px;border-radius:10px;background:rgba(0,212,255,.04);font-size:13px}
.history-item .h-time{color:var(--text2);font-size:11px}
.history-item .h-prize{font-weight:600}
.history-empty{text-align:center;color:var(--text2);font-size:12px;padding:20px 0}

/* 结果弹窗 */
.result-modal{position:fixed;inset:0;background:rgba(0,20,60,.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.result-modal.show{display:flex;animation:fadeIn .3s}
.result-card{
background:linear-gradient(135deg,#003380,#0047AB);
border:2px solid rgba(0,212,255,.3);
border-radius:24px;padding:40px 30px;width:90%;max-width:340px;text-align:center;position:relative;
animation:popIn .4s cubic-bezier(.18,.89,.32,1.28);
box-shadow:0 20px 60px rgba(0,30,80,.6),0 0 40px rgba(0,212,255,.1);
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.result-card .close-btn{position:absolute;top:12px;right:16px;font-size:20px;color:var(--text2);cursor:pointer;background:none;border:none}
.result-card .r-label{font-size:14px;color:var(--text2);margin-bottom:10px}
.result-card .r-icon{font-size:64px;margin-bottom:8px}
.result-card .r-prize{font-size:26px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-card .r-desc{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.5}
.result-card .r-btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--abc-blue));color:#fff}
.result-card .r-btn:active{transform:scale(.97)}

/* 管理后台 */
.admin-modal{position:fixed;inset:0;background:rgba(0,20,60,.8);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(8px)}
.admin-modal.show{display:flex;animation:fadeIn .3s}
.admin-card{background:#003380;border:1px solid var(--card-border);border-radius:20px;padding:24px;width:92%;max-width:420px;max-height:85vh;overflow-y:auto}
.admin-card::-webkit-scrollbar{width:4px}
.admin-card::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:2px}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.admin-header h2{font-size:18px;font-weight:700;color:var(--cyan)}
.admin-header .close-btn{font-size:20px;color:var(--text2);cursor:pointer;background:none;border:none}
.admin-section{margin-bottom:20px}
.admin-section label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.admin-section input,.admin-section select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(0,212,255,.1);background:rgba(0,0,0,.15);color:var(--text);font-size:14px}
.admin-section input:focus{outline:none;border-color:var(--cyan)}
.prize-list{margin-bottom:12px}
.prize-item{display:flex;align-items:center;gap:8px;padding:10px;background:rgba(0,212,255,.04);border-radius:10px;margin-bottom:6px}
.prize-item .p-name{flex:1;font-size:14px}
.prize-item .p-weight{font-size:12px;color:var(--green);min-width:50px;text-align:center}
.prize-item .del-btn{background:rgba(255,82,82,.12);color:var(--red);border:none;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.add-prize-row{display:flex;gap:8px;margin-bottom:12px}
.add-prize-row input{flex:1}
.add-prize-row .add-btn{padding:10px 16px;border:none;border-radius:10px;background:rgba(0,230,118,.12);color:var(--green);font-size:14px;cursor:pointer;white-space:nowrap}
.admin-save{width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--abc-blue));color:#fff}
.admin-hint{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.5}

/* 管理入口 */
.admin-entry{position:fixed;bottom:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2);z-index:50}

/* 密码弹窗 */
.pwd-modal{position:fixed;inset:0;background:rgba(0,20,60,.8);display:none;align-items:center;justify-content:center;z-index:200}
.pwd-modal.show{display:flex}
.pwd-card{background:#003380;border:1px solid var(--card-border);border-radius:20px;padding:30px;width:80%;max-width:300px;text-align:center}
.pwd-card h3{font-size:16px;margin-bottom:16px;color:var(--cyan)}
.pwd-card input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(0,212,255,.1);background:rgba(0,0,0,.15);color:var(--text);font-size:14px;text-align:center;margin-bottom:12px}
.pwd-card input:focus{outline:none;border-color:var(--cyan)}
.pwd-card .pwd-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--abc-blue));color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.pwd-card .pwd-error{color:var(--red);font-size:12px;margin-top:8px;display:none}
.pwd-card .pwd-error.show{display:block}

/* 粒子 */
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:150}

/* 我的奖品弹窗 */
.myprize-modal{position:fixed;inset:0;background:rgba(0,20,60,.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)}
.myprize-modal.show{display:flex;animation:fadeIn .3s}
.myprize-card{
background:linear-gradient(135deg,#003380,#0047AB);
border:2px solid rgba(0,212,255,.3);
border-radius:24px;padding:30px 24px;width:90%;max-width:360px;text-align:center;position:relative;
animation:popIn .4s cubic-bezier(.18,.89,.32,1.28);max-height:80vh;overflow-y:auto;
}
.myprize-card::-webkit-scrollbar{width:4px}
.myprize-card::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:2px}
.myprize-card .close-btn{position:absolute;top:12px;right:16px;font-size:20px;color:var(--text2);cursor:pointer;background:none;border:none}
.myprize-card h2{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--cyan)}
.myprize-summary{font-size:13px;color:var(--text2);margin-bottom:16px}
.myprize-summary .total{color:var(--green);font-weight:700;font-size:20px}
.myprize-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:8px;border-radius:12px;background:rgba(0,212,255,.04);text-align:left}
.myprize-item .mp-name{font-size:15px;font-weight:600;flex:1;text-align:left}
.myprize-item .mp-count{font-size:20px;font-weight:800;color:var(--green);min-width:50px;text-align:center}
.myprize-item .mp-unit{font-size:11px;color:var(--text2)}
.myprize-empty{text-align:center;color:var(--text2);font-size:13px;padding:30px 0}

/* 管理后台标签页 */
.admin-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:10px;overflow:hidden}
.admin-tab{flex:1;padding:10px;text-align:center;font-size:13px;cursor:pointer;background:rgba(0,0,0,.1);border:none;color:var(--text2);transition:.2s}
.admin-tab.active{background:rgba(0,212,255,.12);color:var(--cyan);font-weight:600}
.admin-tab-panel{display:none}
.admin-tab-panel.active{display:block}
.admin-log-list{max-height:300px;overflow-y:auto;margin-bottom:12px}
.admin-log-list::-webkit-scrollbar{width:4px}
.admin-log-list::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:2px}
.admin-log-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:4px;border-radius:8px;background:rgba(0,212,255,.04);font-size:13px}
.admin-log-item .al-prize{font-weight:600}
.admin-log-item .al-time{color:var(--text2);font-size:11px}
.admin-log-empty{text-align:center;color:var(--text2);font-size:12px;padding:20px 0}
.admin-log-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.admin-log-stat{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.12);border-radius:10px;padding:8px 12px;flex:1;min-width:80px;text-align:center}
.admin-log-stat .stat-name{font-size:11px;color:var(--text2)}
.admin-log-stat .stat-num{font-size:18px;font-weight:700;color:var(--green)}
.export-csv-btn{width:100%;padding:10px;border:1px solid rgba(0,212,255,.25);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(0,212,255,.08);color:var(--cyan);margin-top:8px}
.export-csv-btn:active{transform:scale(.97)}
.reset-btn{padding:8px 18px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid rgba(255,82,82,.25);background:rgba(255,82,82,.08);color:var(--red)}
.reset-btn:active{transform:scale(.96)}

/* 扫码区 */
.qr-section{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:16px;backdrop-filter:blur(10px);text-align:center}
.qr-section .qr-title{font-size:13px;color:var(--text2);margin-bottom:10px}
.qr-section .qr-img-box{display:inline-block;background:#fff;padding:10px;border-radius:12px;box-shadow:0 0 20px rgba(0,212,255,.08)}
.qr-section .qr-img-box img{width:180px;height:180px;display:block}
.qr-section .qr-hint{font-size:11px;color:var(--text2);margin-top:8px}

/* 底部信息 */
.footer-info{text-align:center;padding:12px 0 4px}
.footer-info .event-name{font-size:11px;color:var(--text2);line-height:1.6}
.footer-info .leaf{display:inline-block;margin:0 4px}

/* 核销功能样式 */
.result-card .r-code-box{margin-bottom:20px;padding:14px;background:rgba(0,212,255,.06);border:1px dashed rgba(0,212,255,.25);border-radius:12px}
.result-card .r-code-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.result-card .r-code{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--cyan);font-family:'Courier New',monospace}
.result-card .r-code-hint{font-size:10px;color:var(--text2);margin-top:6px}

/* 核销状态徽章 */
.verify-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:1px}
.verify-badge.pending{background:rgba(255,193,7,.15);color:#ffc107;border:1px solid rgba(255,193,7,.25)}
.verify-badge.verified{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.2)}

/* 中奖记录条目核销码 */
.history-item .h-code{font-size:10px;color:var(--cyan);font-family:'Courier New',monospace;margin-top:2px;display:block}
.history-item .h-info{flex:1}

/* 我的奖品核销信息 */
.myprize-item .mp-status{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:80px}
.myprize-item .mp-code{font-size:11px;color:var(--cyan);font-family:'Courier New',monospace}

/* 核销管理面板 */
.verify-input-row{display:flex;gap:8px;margin-bottom:16px}
.verify-input-row input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(0,212,255,.15);background:rgba(0,0,0,.15);color:var(--text);font-size:15px;text-align:center;letter-spacing:4px;font-family:'Courier New',monospace;text-transform:uppercase}
.verify-input-row input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.15)}
.verify-input-row .verify-btn{padding:12px 24px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--green-deep),var(--green));color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.verify-input-row .verify-btn:active{transform:scale(.96)}
.verify-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.verify-stat{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.12);border-radius:10px;padding:8px 14px;flex:1;min-width:80px;text-align:center}
.verify-stat .vs-name{font-size:11px;color:var(--text2)}
.verify-stat .vs-num{font-size:20px;font-weight:700}
.verify-stat.pending .vs-num{color:#ffc107}
.verify-stat.verified .vs-num{color:var(--green)}
.verify-list{max-height:280px;overflow-y:auto;margin-bottom:12px}
.verify-list::-webkit-scrollbar{width:4px}
.verify-list::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:2px}
.verify-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:6px;border-radius:10px;background:rgba(0,212,255,.04);font-size:13px}
.verify-item.verified{opacity:.6}
.verify-item .vi-left{flex:1}
.verify-item .vi-prize{font-weight:600;margin-bottom:2px}
.verify-item .vi-code{font-size:11px;color:var(--cyan);font-family:'Courier New',monospace}
.verify-item .vi-time{font-size:10px;color:var(--text2)}
.verify-item .vi-action{margin-left:10px}
.verify-item .vi-action button{padding:4px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.verify-item .vi-action .v-btn{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.verify-item .vi-action .v-btn:active{transform:scale(.96)}

.verify-empty{text-align:center;color:var(--text2);font-size:12px;padding:20px 0}
.verify-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:linear-gradient(135deg,#003380,#0047AB);border:1px solid var(--cyan);border-radius:16px;padding:20px 30px;text-align:center;z-index:300;opacity:0;transition:all .3s;pointer-events:none}

.verify-toast .vt-sub{font-size:12px;color:var(--text2);margin-top:4px}
.verify-toast.error{border-color:var(--red)}
.verify-toast.error .vt-icon{color:var(--red)}

.loading-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#002766 0%,#003380 30%,#0047AB 60%,#0066CC 100%);z-index:9999;display:flex;align-items:center;justify-content:center}

.loading-overlay .loading-text{color:var(--cyan);font-size:14px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

</style>

<script>
// ===== 用户标识 =====
var userId = localStorage.getItem('lottery_user_id');
if(!userId){
userId = 'U' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,4).toUpperCase();
localStorage.setItem('lottery_user_id', userId);
}
var adminToken = sessionStorage.getItem('lottery_admin_token') || '';

// ===== 全局状态 =====
var config = null;
var myDrawLog = [];
var drawCount = 0;
var isSpinning = false;

// ===== API辅助 =====
async function api(url, options){
try{
var opts = options || {};
opts.headers = opts.headers || {};
if(adminToken) opts.headers['Authorization'] = adminToken;
if(opts.body){
opts.headers['Content-Type'] = 'application/json';
opts.body = JSON.stringify(opts.body);
}
var res = await fetch(url, opts);
var data = await res.json();
if(!res.ok) throw new Error(data.error || '请求失败');
return data;
}catch(e){
console.error('API错误:', e);
throw e;
}
}

// ===== 工具函数 =====
function escapeHtml(s){
var d = document.createElement('div');
d.textContent = s;
return d.innerHTML;
}

// ===== 初始化 =====
async function init(){
try{
var data = await api('/api/config?userId=' + userId);
config = data;
drawCount = data.myDrawCount || 0;

myDrawLog = await api('/api/my-prizes?userId=' + userId);

document.getElementById('loadingOverlay').style.display = 'none';
updateUI();
renderDrawLog();
if(myDrawLog.length > 0){
showLatestPrize(myDrawLog[myDrawLog.length - 1].prize);
}
}catch(e){
document.getElementById('loadingOverlay').innerHTML =
'<div style="text-align:center;color:#fff;padding:40px">' +
'<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
'<div style="font-size:16px;margin-bottom:8px">无法连接服务器</div>' +
'<div style="font-size:12px;color:rgba(255,255,255,.5)">' + escapeHtml(e.message) + '</div>' +
'<button onclick="location.reload()" style="margin-top:16px;padding:8px 24px;border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.08);color:#00D4FF;border-radius:20px;cursor:pointer">重试</button>' +
'</div>';
}
}

// ===== 更新按钮和剩余次数 =====
function updateUI(){
var btn = document.getElementById('drawBtn');
var label = document.getElementById('btnLabel');
var hint = document.getElementById('btnHint');
var remainNum = document.getElementById('remainNum');

if(!config) return;

if(config.maxDraws > 0){
var left = Math.max(0, config.maxDraws - drawCount);
remainNum.textContent = left;
if(left <= 0){
label.textContent = '已抽完';
hint.textContent = '次数用完';
btn.classList.add('disabled');
}else{
label.textContent = '抽奖';
hint.textContent = '点击开始';
btn.classList.remove('disabled');
}
}else{
remainNum.textContent = '∞';
label.textContent = '抽奖';
hint.textContent = '点击开始';
btn.classList.remove('disabled');
}
}

// ===== 渲染中奖记录 =====
function renderDrawLog(){
var listEl = document.getElementById('historyList');
if(myDrawLog.length === 0){
listEl.innerHTML = '<div class="history-empty">暂无记录，快来抽奖吧~</div>';
return;
}
var html = '';
for(var i = myDrawLog.length - 1; i >= 0 && i >= myDrawLog.length - 20; i--){
var h = myDrawLog[i];
var badge = h.status === 'verified'
? '<span class="verify-badge verified">已核销</span>'
: '<span class="verify-badge pending">待核销</span>';
var codeStr = h.code ? '<span class="h-code">' + escapeHtml(h.code) + '</span>' : '';
html += '<div class="history-item">' +
'<div class="h-info">' +
'<span class="h-prize">' + escapeHtml(h.prize) + '</span>' +
codeStr +
'</div>' +
'<div style="text-align:right">' +
badge +
'<div class="h-time">' + h.time + '</div>' +
'</div>' +
'</div>';
}
listEl.innerHTML = html;
}

// ===== 显示最新中奖 =====
function showLatestPrize(name){
var box = document.getElementById('latestPrize');
document.getElementById('latestPrizeName').textContent = name;
box.classList.add('show');
}

// ===== 执行抽奖 =====
async function doDraw(){
if(isSpinning) return;
if(!config){
alert('正在加载中，请稍候...');
return;
}

if(!config.prizes || config.prizes.length === 0){
alert('奖池为空，请联系管理员设置奖品');
return;
}

if(config.maxDraws > 0 && drawCount >= config.maxDraws){
alert('抽奖次数已用完');
return;
}

isSpinning = true;
var btn = document.getElementById('drawBtn');
btn.classList.add('spinning');
var rollingText = document.getElementById('rollingText');
rollingText.style.display = 'flex';

var allNames = config.prizes.map(function(p){ return p.name; });
var rollIdx = 0;
var rollTimer = setInterval(function(){
rollingText.textContent = allNames[rollIdx % allNames.length];
rollIdx++;
}, 80);

// 同时发起API请求
var apiPromise = api('/api/draw', {
method: 'POST',
body: { userId: userId }
}).catch(function(e){
return { error: e.message };
});

// 等待动画结束
await new Promise(function(resolve){ setTimeout(resolve, 2500); });

clearInterval(rollTimer);
btn.classList.remove('spinning');
rollingText.style.display = 'none';

var result = await apiPromise;

if(result.error){
alert(result.error);
isSpinning = false;
updateUI();
return;
}

drawCount++;
myDrawLog.push({
prize: result.prize,
time: result.time,
code: result.code,
status: 'pending',
verifiedTime: ''
});

updateUI();
renderDrawLog();
showLatestPrize(result.prize);
showResultModal(result.prize, result.code);
createParticles();

isSpinning = false;
}

// ===== 结果弹窗 =====
function showResultModal(prizeName, vCode){
document.getElementById('rPrize').textContent = prizeName;
var icon = '🎉';
if(prizeName.indexOf('一') >= 0 || prizeName.indexOf('特') >= 0){
icon = '🏆';
}else if(prizeName.indexOf('二') >= 0){
icon = '🥈';
}else if(prizeName.indexOf('三') >= 0){
icon = '🥉';
}else if(prizeName.indexOf('完赛') >= 0){
icon = '🏅';
}else if(prizeName.indexOf('谢谢') >= 0 || prizeName.indexOf('参与') >= 0){
icon = '🍃';
}
document.getElementById('rIcon').textContent = icon;
if(vCode){
document.getElementById('rCode').textContent = vCode;
document.getElementById('rCodeBox').style.display = 'block';
}else{
document.getElementById('rCodeBox').style.display = 'none';
}
document.getElementById('resultModal').classList.add('show');
}

function closeResult(){
document.getElementById('resultModal').classList.remove('show');
}

// ===== 粒子效果 =====
function createParticles(){
var colors = ['#00D4FF','#00E676','#00BCD4','#ffffff','#00C853','#80D8FF'];
for(var i = 0; i < 30; i++){
(function(){
var p = document.createElement('div');
p.className = 'particle';
p.style.background = colors[Math.floor(Math.random()*colors.length)];
p.style.left = '50%';
p.style.top = '50%';
document.body.appendChild(p);
var angle = Math.random() * Math.PI * 2;
var distance = 80 + Math.random() * 200;
var dx = Math.cos(angle) * distance;
var dy = Math.sin(angle) * distance;
var duration = 600 + Math.random() * 600;
p.animate([
{transform:'translate(-50%,-50%) scale(1)',opacity:1},
{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(0)',opacity:0}
],{duration:duration,easing:'cubic-bezier(.15,.65,.5,1)'}).onfinish = function(){
p.remove();
};
})();
}
}

// ===== 我的奖品 =====
async function showMyPrizes(){
try{
myDrawLog = await api('/api/my-prizes?userId=' + userId);
}catch(e){
alert('加载失败: ' + e.message);
return;
}
renderMyPrizes();
document.getElementById('myPrizeModal').classList.add('show');
}

function closeMyPrizes(){
document.getElementById('myPrizeModal').classList.remove('show');
}

function renderMyPrizes(){
var listEl = document.getElementById('myPrizeList');
document.getElementById('mpTotal').textContent = myDrawLog.length;

if(myDrawLog.length === 0){
listEl.innerHTML = '<div class="myprize-empty">还没有中奖记录哦~<br>快去抽奖吧！</div>';
return;
}

var summary = {};
for(var i = 0; i < myDrawLog.length; i++){
var name = myDrawLog[i].prize;
summary[name] = (summary[name] || 0) + 1;
}

var arr = [];
for(var name in summary){
arr.push({name: name, count: summary[name]});
}
arr.sort(function(a, b){ return b.count - a.count; });

var html = '';
for(var i = 0; i < arr.length; i++){
var verifiedCount = 0;
for(var j = 0; j < myDrawLog.length; j++){
if(myDrawLog[j].prize === arr[i].name && myDrawLog[j].status === 'verified') verifiedCount++;
}
var pendingCount = arr[i].count - verifiedCount;
html += '<div class="myprize-item">' +
'<div class="mp-name">' + escapeHtml(arr[i].name) + '</div>' +
'<div class="mp-status">' +
'<span class="mp-count">' + arr[i].count + '<span class="mp-unit">次</span></span>' +
(verifiedCount > 0 ? '<span class="verify-badge verified" style="font-size:9px">已核销 ' + verifiedCount + '</span>' : '') +
(pendingCount > 0 ? '<span class="verify-badge pending" style="font-size:9px">待核销 ' + pendingCount + '</span>' : '') +
'</div>' +
'</div>';
}

html += '<div style="margin-top:12px;text-align:left">';
html += '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">核销码明细</div>';
for(var i = myDrawLog.length - 1; i >= 0; i--){
var h = myDrawLog[i];
var badge = h.status === 'verified'
? '<span class="verify-badge verified">已核销</span>'
: '<span class="verify-badge pending">待核销</span>';
html += '<div class="myprize-item" style="padding:8px 12px">' +
'<div><div style="font-size:13px;font-weight:600">' + escapeHtml(h.prize) + '</div>' +
'<div class="mp-code">' + (h.code || '—') + '</div></div>' +
'<div style="text-align:right">' + badge + '<div style="font-size:10px;color:var(--text2);margin-top:2px">' + h.time + '</div></div>' +
'</div>';
}
html += '</div>';
listEl.innerHTML = html;
}

// ===== 管理后台 =====
function showPwdModal(){
document.getElementById('pwdModal').classList.add('show');
document.getElementById('pwdInput').value = '';
document.getElementById('pwdError').classList.remove('show');
setTimeout(function(){ document.getElementById('pwdInput').focus(); }, 100);
}

async function checkPwd(){
var input = document.getElementById('pwdInput').value;
try{
var res = await api('/api/admin/login', {
method: 'POST',
body: { password: input }
});
adminToken = res.token;
sessionStorage.setItem('lottery_admin_token', adminToken);
config = res.config;
document.getElementById('pwdModal').classList.remove('show');
openAdmin();
}catch(e){
document.getElementById('pwdError').textContent = e.message;
document.getElementById('pwdError').classList.add('show');
}
}

function openAdmin(){
document.getElementById('adminModal').classList.add('show');
document.getElementById('adminPwd').value = config.password;
document.getElementById('drawMode').value = config.mode;
document.getElementById('maxDraws').value = config.maxDraws;
renderPrizeList();
}

function closeAdmin(){
document.getElementById('adminModal').classList.remove('show');
}

function renderPrizeList(){
var listEl = document.getElementById('prizeList');
var html = '';
for(var i = 0; i < config.prizes.length; i++){
var p = config.prizes[i];
html += '<div class="prize-item">' +
'<span class="p-name">' + escapeHtml(p.name) + '</span>' +
'<span class="p-weight">' + p.weight + '</span>' +
'<button class="del-btn" onclick="delPrize(' + i + ')">删除</button>' +
'</div>';
}
listEl.innerHTML = html;
}

function addPrizeRow(){
var name = document.getElementById('newPrizeName').value.trim();
var weight = parseInt(document.getElementById('newPrizeWeight').value) || 1;
if(!name){ alert('请输入奖品名称'); return; }
config.prizes.push({name: name, weight: weight});
document.getElementById('newPrizeName').value = '';
document.getElementById('newPrizeWeight').value = '1';
renderPrizeList();
}

function delPrize(idx){
config.prizes.splice(idx, 1);
renderPrizeList();
}

async function saveConfig(){
var pwd = document.getElementById('adminPwd').value.trim();
if(!pwd){ alert('请设置管理密码'); return; }
config.password = pwd;
config.mode = document.getElementById('drawMode').value;
config.maxDraws = parseInt(document.getElementById('maxDraws').value) || 0;
try{
await api('/api/admin/config', {
method: 'POST',
body: config
});
drawCount = 0;
// 刷新我的抽奖次数
var data = await api('/api/config?userId=' + userId);
drawCount = data.myDrawCount || 0;
updateUI();
closeAdmin();
alert('设置已保存！\n抽奖次数: ' + (config.maxDraws > 0 ? config.maxDraws : '无限') + ' 次');
}catch(e){
alert('保存失败: ' + e.message);
}
}

// ===== 标签切换 =====
function switchTab(n){
document.getElementById('tab1').classList.toggle('active', n === 1);
document.getElementById('tab2').classList.toggle('active', n === 2);
document.getElementById('tab3').classList.toggle('active', n === 3);
document.getElementById('panel1').classList.toggle('active', n === 1);
document.getElementById('panel2').classList.toggle('active', n === 2);
document.getElementById('panel3').classList.toggle('active', n === 3);
if(n === 2) renderAdminLog();
if(n === 3) renderVerifyPanel();
}

// ===== 管理后台中奖明细 =====
async function renderAdminLog(){
var summaryEl = document.getElementById('adminLogSummary');
var listEl = document.getElementById('adminLogList');

try{
var allLogs = await api('/api/admin/logs');
}catch(e){
summaryEl.innerHTML = '';
listEl.innerHTML = '<div class="admin-log-empty">加载失败: ' + escapeHtml(e.message) + '</div>';
return;
}

if(allLogs.length === 0){
summaryEl.innerHTML = '';
listEl.innerHTML = '<div class="admin-log-empty">暂无中奖记录</div>';
return;
}

var summary = {};
for(var i = 0; i < allLogs.length; i++){
var name = allLogs[i].prize;
summary[name] = (summary[name] || 0) + 1;
}

var summaryHtml = '<div class="admin-log-stat"><div class="stat-name">总抽奖次数</div><div class="stat-num">' + allLogs.length + '</div></div>';
for(var name in summary){
summaryHtml += '<div class="admin-log-stat"><div class="stat-name">' + escapeHtml(name) + '</div><div class="stat-num">' + summary[name] + '</div></div>';
}
summaryEl.innerHTML = summaryHtml;

var logHtml = '';
for(var i = allLogs.length - 1; i >= 0; i--){
var h = allLogs[i];
var badge = h.status === 'verified'
? '<span class="verify-badge verified">已核销</span>'
: '<span class="verify-badge pending">待核销</span>';
logHtml += '<div class="admin-log-item">' +
'<span class="al-prize">' + escapeHtml(h.prize) + ' ' + badge + '</span>' +
'<span class="al-time">' + h.time + (h.code ? ' · ' + escapeHtml(h.code) : '') + '</span>' +
'</div>';
}
listEl.innerHTML = logHtml;
}

// ===== 核销管理 =====
async function verifyPrize(){
var input = document.getElementById('verifyInput');
var code = input.value.trim().toUpperCase();
if(!code){ showVerifyToast('请输入核销码', '', false); return; }

try{
var res = await api('/api/admin/verify', {
method: 'POST',
body: { code: code }
});
input.value = '';
renderVerifyPanel();
renderDrawLog();
showVerifyToast('核销成功！', res.prize + ' · ' + res.code, true);
}catch(e){
input.value = '';
showVerifyToast(e.message, '核销码: ' + code, false);
}
}

async function renderVerifyPanel(){
var summaryEl = document.getElementById('verifySummary');
var listEl = document.getElementById('verifyList');

try{
var allLogs = await api('/api/admin/logs');
}catch(e){
summaryEl.innerHTML = '';
listEl.innerHTML = '<div class="verify-empty">加载失败: ' + escapeHtml(e.message) + '</div>';
return;
}

if(allLogs.length === 0){
summaryEl.innerHTML = '';
listEl.innerHTML = '<div class="verify-empty">暂无中奖记录</div>';
return;
}

var pendingCount = 0, verifiedCount = 0;
for(var i = 0; i < allLogs.length; i++){
if(allLogs[i].status === 'verified') verifiedCount++;
else pendingCount++;
}

summaryEl.innerHTML =
'<div class="verify-stat"><div class="vs-name">总中奖</div><div class="vs-num">' + allLogs.length + '</div></div>' +
'<div class="verify-stat pending"><div class="vs-name">待核销</div><div class="vs-num">' + pendingCount + '</div></div>' +
'<div class="verify-stat verified"><div class="vs-name">已核销</div><div class="vs-num">' + verifiedCount + '</div></div>';

var html = '';
for(var i = allLogs.length - 1; i >= 0; i--){
var h = allLogs[i];
var isVerified = h.status === 'verified';
html += '<div class="verify-item' + (isVerified ? ' verified' : '') + '">';
html += '<div class="vi-left">';
html += '<div class="vi-prize">' + escapeHtml(h.prize) + '</div>';
html += '<div class="vi-code">' + escapeHtml(h.code || '—') + '</div>';
html += '<div class="vi-time">中奖: ' + h.time;
if(isVerified && h.verifiedTime) html += ' | 核销: ' + h.verifiedTime;
html += '</div>';
html += '</div>';
html += '<div class="vi-action">';
if(isVerified){
html += '<span class="vi-status">✅ 已核销</span>';
}else{
html += '<button class="v-btn" onclick="verifyByCode(\'' + h.code + '\')">核销</button>';
}
html += '</div>';
html += '</div>';
}
listEl.innerHTML = html;
}

async function verifyByCode(code){
try{
var res = await api('/api/admin/verify', {
method: 'POST',
body: { code: code }
});
renderVerifyPanel();
renderDrawLog();
showVerifyToast('核销成功！', res.prize + ' · ' + res.code, true);
}catch(e){
showVerifyToast(e.message, '核销码: ' + code, false);
}
}

function showVerifyToast(msg, sub, success){
var toast = document.getElementById('verifyToast');
var icon = document.getElementById('vtIcon');
var msgEl = document.getElementById('vtMsg');
var subEl = document.getElementById('vtSub');
icon.textContent = success ? '✅' : '⚠️';
msgEl.textContent = msg;
subEl.textContent = sub;
toast.classList.toggle('error', !success);
toast.classList.add('show');
setTimeout(function(){ toast.classList.remove('show'); }, 2000);
}

// ===== 重置(管理员) =====
async function resetAll(){
if(!adminToken){
alert('请先进入管理后台');
return;
}
if(confirm('确定要重置吗？\n\n将清空所有用户的中奖记录和核销数据。\n（奖池设置不会被清除）')){
try{
await api('/api/admin/reset', { method: 'POST', body: {} });
myDrawLog = await api('/api/my-prizes?userId=' + userId);
drawCount = 0;
renderDrawLog();
updateUI();
document.getElementById('latestPrize').classList.remove('show');
alert('已重置！所有数据已清空');
}catch(e){
alert('重置失败: ' + e.message);
}
}
}

// ===== 导出CSV =====
async function exportCSV(){
try{
var allLogs = await api('/api/admin/logs');
}catch(e){
// 非管理员只能导出自己的
allLogs = myDrawLog;
}

if(allLogs.length === 0){
alert('暂无中奖记录可导出');
return;
}

var summary = {};
for(var i = 0; i < allLogs.length; i++){
var name = allLogs[i].prize;
summary[name] = (summary[name] || 0) + 1;
}

var csv = '\uFEFF';
csv += '奖品名称,中奖次数,占比\n';
var total = allLogs.length;
for(var name in summary){
var pct = (summary[name] / total * 100).toFixed(1) + '%';
csv += name + ',' + summary[name] + ',' + pct + '\n';
}
csv += '\n';
csv += '序号,奖品名称,中奖时间,核销码,核销状态,核销时间\n';
for(var i = 0; i < allLogs.length; i++){
var h = allLogs[i];
var status = h.status === 'verified' ? '已核销' : '待核销';
var vTime = h.verifiedTime || '';
csv += (i + 1) + ',' + h.prize + ',' + h.time + ',' + (h.code || '') + ',' + status + ',' + vTime + '\n';
}

var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = '中奖记录_' + new Date().toISOString().slice(0,10) + '.csv';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
